name: Build Modules

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apphider:
    name: 应用列表隐藏
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        run: |
          set -e
          PLATFORM_DIR=""
          for d in "$ANDROID_HOME/platforms"/*; do
            if [ -f "$d/android.jar" ]; then PLATFORM_DIR="$d"; fi
          done
          [ -z "$PLATFORM_DIR" ] && { echo "no android.jar"; exit 1; }
          echo "ANDROID_JAR=$PLATFORM_DIR/android.jar" >> $GITHUB_ENV

          if [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            BT_DIR="$ANDROID_HOME/build-tools/34.0.0"
          else
            BT_DIR=$(ls -1d "$ANDROID_HOME/build-tools"/* 2>/dev/null | sort -V | tail -1)
          fi
          [ -z "$BT_DIR" ] && { echo "no build-tools"; exit 1; }
          echo "BUILD_TOOLS=$BT_DIR" >> $GITHUB_ENV
          echo "OK: $PLATFORM_DIR / $BT_DIR"

      - name: 编译
        run: |
          set -e
          MOD="apphider"
          PKGDIR="src/com/pullautumn/apphider"
          mkdir -p build/stub build/obj build/gen build/dex dist

          find stub -name "*.java" > build/stub_src.txt
          javac -source 8 -target 8 -encoding UTF-8 -d build/stub @build/stub_src.txt

          "$BUILD_TOOLS/aapt2" link \
            -o build/base.apk \
            -I "$ANDROID_JAR" \
            --manifest "$MOD/src/AndroidManifest.xml" \
            --java build/gen \
            --min-sdk-version 21 \
            --target-sdk-version 34

          find "$MOD/$PKGDIR" -name "*.java" > build/main_src.txt
          if [ -d build/gen ]; then find build/gen -name "*.java" >> build/main_src.txt; fi
          echo "--- sources ---"
          cat build/main_src.txt

          javac -source 8 -target 8 -encoding UTF-8 \
            -bootclasspath "$ANDROID_JAR" \
            -classpath "$ANDROID_JAR:build/stub" \
            -d build/obj @build/main_src.txt

          find build/obj -name "*.class" > build/classes.txt
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --min-api 21 \
            --output build/dex $(cat build/classes.txt)

          cd build/dex && zip -u ../base.apk classes.dex && cd ../..
          cd "$MOD/src" && zip -u "../../build/base.apk" assets/xposed_init && cd ../..

          "$BUILD_TOOLS/zipalign" -f -p 4 build/base.apk build/aligned.apk

          keytool -genkeypair -v \
            -keystore build/release.keystore -alias "$MOD" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=$MOD, OU=Dev, O=Personal, L=NA, ST=NA, C=CN"

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/release.keystore --ks-key-alias "$MOD" \
            --ks-pass pass:android --key-pass pass:android \
            --out "dist/AppListHide.apk" build/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "dist/AppListHide.apk"

          echo "--- APK ---"
          unzip -l dist/AppListHide.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppListHide
          path: dist/AppListHide.apk
          retention-days: 30

  envmask:
    name: 运行环境适配
